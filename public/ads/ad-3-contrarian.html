<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>AXAU — Gold Without the Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden}
.ad{
  width:100vw;height:100vh;
  background:#14101e;
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:6vh 7vw;
}
.logo{display:flex;align-items:center;gap:1.2vw}
.logo img{max-height:7vh;width:auto;object-fit:contain}
.logo-word{
  font-family:'Cormorant Garamond',serif;
  font-size:3.2vw;font-weight:700;
  color:#ddd0f0;letter-spacing:0.18em;
  text-transform:uppercase;
}
.middle{display:flex;flex-direction:column;gap:2.5vh}
.eyebrow{
  font-family:'Source Code Pro',monospace;
  font-size:1.6vw;font-weight:600;
  color:#9b7fd4;letter-spacing:0.22em;
  text-transform:uppercase;
}
.headline{
  font-family:'Cormorant Garamond',serif;
  font-size:8.5vw;font-weight:700;
  line-height:1.0;
  color:#ddd0f0;
}
.subline{
  font-family:'Cormorant Garamond',serif;
  font-size:4.5vw;font-style:italic;font-weight:400;
  color:#9b7fd4;
  line-height:1.1;
}
.separator{
  display:flex;align-items:center;gap:2vw;margin:0.5vh 0;
}
.sep-line{flex:1;max-width:8vw;height:1px;background:rgba(155,127,212,0.4)}
.sep-dot{width:0.6vw;height:0.6vw;border-radius:50%;background:#9b7fd4;opacity:0.7}
.subtitle{
  font-family:'Source Code Pro',monospace;
  font-size:1.5vw;font-weight:400;
  color:rgba(221,208,240,0.45);
  letter-spacing:0.08em;line-height:1.6;
  max-width:58vw;
}
.footer{
  font-family:'Source Code Pro',monospace;
  font-size:1.4vw;color:rgba(221,208,240,0.3);
  letter-spacing:0.12em;
}
</style>
</head>
<body>
<div class="ad">
  <div class="logo">
    <img src="/axiom-logo-transparent.png" alt="Axiom Protocol">
    <span class="logo-word">Axiom</span>
  </div>
  <div class="middle">
    <span class="eyebrow">A Different Gold</span>
    <div class="headline">Gold without</div>
    <div class="subline">the vault.</div>
    <div class="separator">
      <div class="sep-line"></div>
      <div class="sep-dot"></div>
    </div>
    <div class="subtitle">AXAU holds reserve-grade gold on Arbitrum One.<br>No custodian. No geography. No lock-in.</div>
  </div>
  <span class="footer">axiomprotocol.app/axau-early-access</span>
</div>
</body>
</html>
