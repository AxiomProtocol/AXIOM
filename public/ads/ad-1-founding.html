<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>AXAU Early Access — Founding Cohort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a1628}
.ad{
  width:100vw;height:100vh;
  background:#0a1628;
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:6vh 7vw;
  position:relative;
}
.logo{display:flex;align-items:center;gap:1.2vw}
.logo img{max-height:7vh;width:auto;object-fit:contain}
.logo-word{
  font-family:'Cormorant Garamond',serif;
  font-size:3.2vw;font-weight:700;
  color:#e8d5a0;letter-spacing:0.18em;
  text-transform:uppercase;
}
.middle{display:flex;flex-direction:column;gap:3vh}
.eyebrow{
  font-family:'Source Code Pro',monospace;
  font-size:1.6vw;font-weight:600;
  color:#b8860b;letter-spacing:0.22em;
  text-transform:uppercase;
}
.headline{
  font-family:'Cormorant Garamond',serif;
  font-size:9vw;font-weight:700;
  line-height:1.0;
  color:#e8d5a0;
}
.headline em{color:#b8860b;font-style:normal}
.subtitle{
  font-family:'Cormorant Garamond',serif;
  font-size:2.4vw;font-weight:400;font-style:italic;
  color:rgba(232,213,160,0.65);
  line-height:1.4;
  max-width:65vw;
}
.rule{width:6vw;height:1px;background:#b8860b;opacity:0.7}
.footer{
  font-family:'Source Code Pro',monospace;
  font-size:1.4vw;color:rgba(232,213,160,0.4);
  letter-spacing:0.12em;
}
</style>
</head>
<body>
<div class="ad">
  <div class="logo">
    <img src="/axiom-logo-transparent.png" alt="Axiom Protocol">
    <span class="logo-word">Axiom</span>
  </div>
  <div class="middle">
    <span class="eyebrow">Early Access</span>
    <div class="rule"></div>
    <div class="headline"><em>100</em> founding<br>wallets.</div>
    <div class="subtitle">The AXAU reserve program is open.<br>Yours could be one of them.</div>
  </div>
  <span class="footer">axiomprotocol.app/axau-early-access</span>
</div>
</body>
</html>
