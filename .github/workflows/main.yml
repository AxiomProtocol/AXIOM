name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/107966396865/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: axiom-github-deployer@axiom-protocol-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          docker build -t us-central1-docker.pkg.dev/axiom-protocol-prod/axiom/axiom:latest .
          docker push us-central1-docker.pkg.dev/axiom-protocol-prod/axiom/axiom:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy axiom \
            --image us-central1-docker.pkg.dev/axiom-protocol-prod/axiom/axiom:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
