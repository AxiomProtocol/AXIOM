name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/107966396865/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: axiom-github-deployer@axiom-protocol-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: axiom-protocol-prod

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy axiom-protocol \
            --source . \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
