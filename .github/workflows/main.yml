name: CI / Deploy to Cloud Run

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: axiom-protocol-prod
  PROJECT_NUMBER: "1079666396865"
  REGION: us-central1

  CLOUD_RUN_SERVICE: axiom-protocol
  ARTIFACT_REPOSITORY: axiom-repo
  IMAGE_NAME: axiom-protocol

  SERVICE_ACCOUNT: axiom-github-deployer@axiom-protocol-prod.iam.gserviceaccount.com
  WIF_PROVIDER: projects/1079666396865/locations/global/workloadIdentityPools/github-pool/providers/github-pool

jobs:
  test:
    name: Policy + Audit Correctness Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capinfra
          POSTGRES_PASSWORD: capinfra
          POSTGRES_DB: capinfra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capinfra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://capinfra:capinfra@localhost:5432/capinfra_test
      ADMIN_SOLVENCY_KEY: ${{ secrets.ADMIN_SOLVENCY_KEY }}
      CAPINFRA_BASE_URL: http://localhost:5000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Start dev server
        run: npm run dev > /tmp/devserver.log 2>&1 &

      - name: Wait for dev server to be ready
        run: |
          echo "Waiting for dev server on port 5000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1 || \
               curl -sf http://localhost:5000 > /dev/null 2>&1; then
              echo "Dev server is ready."
              exit 0
            fi
            echo "  attempt $i/30 — sleeping 5 s"
            sleep 5
          done
          echo "Dev server did not become ready in time." >&2
          exit 1

      - name: Seed test data
        run: npx tsx scripts/capinfra-seed.ts

      - name: Run capinfra smoke + correctness tests
        run: npm run test:capinfra

      - name: Run oracle-fallback pruning tests
        run: npm run test:prune-oracle-fallback

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Run audit CSV e2e tests
        env:
          PORT: 5000
          PLAYWRIGHT_BASE_URL: http://localhost:5000
          NODE_ENV: test
        run: npm run test:e2e:audit-csv

      - name: Upload dev-server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devserver-log
          path: /tmp/devserver.log

  deploy:
    name: Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format="value(status.url)"
