name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: axiom-protocol-prod
  PROJECT_NUMBER: "1079666396865"
  REGION: us-central1

  CLOUD_RUN_SERVICE: axiom-protocol
  ARTIFACT_REPOSITORY: axiom-repo
  IMAGE_NAME: axiom-protocol

  SERVICE_ACCOUNT: axiom-github-deployer@axiom-protocol-prod.iam.gserviceaccount.com
  WIF_PROVIDER: projects/1079666396865/locations/global/workloadIdentityPools/github-pool/providers/github-pool

jobs:
  predeploy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run capinfra smoke + correctness tests
        run: npm run test:capinfra

      - name: Run vitest suite
        run: npm run test:vitest

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start dev server
        env:
          PORT: "5000"
          NODE_ENV: test
        run: npm run dev > /tmp/devserver.log 2>&1 &

      - name: Wait for dev server to be ready
        run: |
          echo "Waiting for dev server on port 5000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/healthz > /dev/null 2>&1; then
              echo "Dev server is ready after ${i}s"
              exit 0
            fi
            echo "  attempt ${i}/30..."
            sleep 2
          done
          echo "Dev server did not become ready in time"
          cat /tmp/devserver.log
          exit 1

      - name: Run audit CSV e2e tests
        env:
          PORT: "5000"
          PLAYWRIGHT_BASE_URL: http://localhost:5000
          NODE_ENV: test
        run: npm run test:e2e:audit-csv

      - name: Run picker e2e tests
        env:
          PORT: "5000"
          PLAYWRIGHT_BASE_URL: http://localhost:5000
          NODE_ENV: test
        run: npm run test:e2e:pickers

      - name: Run asset registry CSV e2e tests
        env:
          PORT: "5000"
          PLAYWRIGHT_BASE_URL: http://localhost:5000
          NODE_ENV: test
        run: npm run test:e2e:asset-csv

      - name: Upload dev-server log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devserver-log
          path: /tmp/devserver.log
          if-no-files-found: ignore

  deploy:
    needs: predeploy-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format="value(status.url)"
