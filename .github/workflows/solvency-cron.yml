name: Solvency Refresh

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/refresh-solvency
        env:
          ADMIN_SOLVENCY_KEY: ${{ secrets.ADMIN_SOLVENCY_KEY }}
          CRON_SECRET:        ${{ secrets.CRON_SECRET }}
          APP_URL:            ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL repo secret must be set."
            exit 1
          fi
          # Prefer ADMIN_SOLVENCY_KEY; fall back to CRON_SECRET for backward compat.
          AUTH_TOKEN="${ADMIN_SOLVENCY_KEY:-${CRON_SECRET:-}}"
          if [ -z "${AUTH_TOKEN:-}" ]; then
            echo "::error::Either ADMIN_SOLVENCY_KEY or CRON_SECRET repo secret must be set."
            exit 1
          fi
          RESP=$(mktemp)
          HTTP=$(curl -sS -o "$RESP" -w '%{http_code}' -X POST \
                      -H "Authorization: Bearer $AUTH_TOKEN" \
                      -H "Content-Type: application/json" \
                      "$APP_URL/api/cron/refresh-solvency")
          echo "HTTP $HTTP"
          cat "$RESP"
          echo
          if [ "$HTTP" != "200" ]; then
            echo "::error::Solvency refresh failed with HTTP $HTTP"
            exit 1
          fi
          jq -e '.success == true or .ok == true or (.snapshotId|type=="string")' "$RESP" \
            || (echo "::error::Response did not look successful"; exit 1)
