name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1079666396865/locations/global/workloadIdentityPools/github-pool/providers/github-pool
          service_account: axiom-github-deployer@axiom-protocol-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: axiom-protocol-prod

      - name: Build and Deploy to Cloud Run
        run: |
          gcloud run deploy axiom-protocol \
            --source . \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
